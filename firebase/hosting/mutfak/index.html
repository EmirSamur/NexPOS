<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mutfak Ekranı · NexPOS</title>
  <link rel="stylesheet" href="/mutfak/kds.css">
</head>
<body>
  <!-- Eşleme: panelde Terminaller → "Mutfak ekranı ekle" ile alınan 6 haneli kod -->
  <section id="pair" class="screen" hidden>
    <form id="pair-form" class="pair-card" autocomplete="off">
      <h1>🍳 Mutfak Ekranı</h1>
      <p class="muted">NexPOS yönetim panelinde <b>Terminaller → Mutfak ekranı ekle</b> ile aldığınız kodu girin.</p>
      <label>Eşleme kodu
        <input id="pair-code" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="••••••" required>
      </label>
      <fieldset class="stations">
        <legend>Bu ekran hangi istasyon için?</legend>
        <label><input type="radio" name="station" value="kitchen" checked> 🍳 Mutfak</label>
        <label><input type="radio" name="station" value="bar"> ☕ Bar</label>
        <label><input type="radio" name="station" value="all"> İkisi</label>
      </fieldset>
      <label>Ekran adı (isteğe bağlı)
        <input id="pair-name" maxlength="40" placeholder="ör. Mutfak tableti">
      </label>
      <button id="pair-btn" type="submit">Eşle</button>
      <p id="pair-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- Bilgi / hata ekranı (iptal, modül kapalı, yükleniyor) -->
  <section id="message" class="screen">
    <div class="pair-card">
      <h1 id="message-title">Yükleniyor…</h1>
      <p id="message-text" class="muted"></p>
      <button id="message-btn" type="button" hidden></button>
    </div>
  </section>

  <section id="board" class="screen" hidden>
    <header class="topbar">
      <div class="title"><span id="station-title">MUTFAK</span> · <span id="clock">--:--</span></div>
      <div id="conn" class="conn ok">🟢 Bağlı</div>
      <div id="allday" class="allday"></div>
      <button id="sound-btn" class="ghost" type="button" title="Yeni fişte ses">🔔</button>
    </header>
    <main id="tickets" class="tickets" aria-live="polite"></main>
    <p id="empty" class="empty" hidden>Bekleyen fiş yok.</p>
    <footer class="bottombar">
      <button id="undo-btn" class="ghost" type="button" disabled>↶ Son kapatılanı geri al</button>
      <div class="filters" role="tablist">
        <button data-filter="all" class="active" type="button">Hepsi</button>
        <button data-filter="new" type="button">Yeni</button>
        <button data-filter="preparing" type="button">Hazırlanan</button>
      </div>
      <button id="unpair-btn" class="link" type="button">Eşlemeyi kaldır</button>
    </footer>
  </section>

  <script type="module" src="/mutfak/kds.js"></script>
</body>
</html>
